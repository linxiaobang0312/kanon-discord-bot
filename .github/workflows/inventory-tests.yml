name: Inventory adapter tests
on:
  push:
    branches: [main]
    paths:
      - inventory_lookup.py
      - bot.py
      - test_inventory_lookup.py
      - .github/workflows/inventory-tests.yml
  workflow_dispatch:

jobs:
  test-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v test_inventory_lookup.py
